<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 4 -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">

    <title>{% block title %}PesticideDB - Pesticide Biodegradation Database{% endblock %}</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/layout.css' %}?v=10">
    <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}?v=2">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-M6ZQRS3NJ0"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-M6ZQRS3NJ0');
    </script>

    {% block extra_head %}{% endblock %}
</head>

<!-- ✅ Sticky footer setup (Bootstrap-friendly) -->
<body class="d-flex flex-column min-vh-100">
    <!-- Navigation -->
    {% include 'navigation.html' %}

    <!-- ✅ Main Content (flex-fill pushes footer to bottom when page is short) -->
    <main class="flex-fill">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer-dark bg-dark text-light mt-auto">
        <br><br>
        <div class="container-fluid padding">
            <div class="row text-center">
                <div class="col-md-12">
                    <p class="h5 mb-1">PesticideDB v1.0</p>
                    <p class="small mb-0">Released June 15, 2026 | 2026</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
